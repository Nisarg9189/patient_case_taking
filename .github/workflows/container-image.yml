# Builds the app's Docker image (deploy/Dockerfile) and publishes it to GitHub Container
# Registry as ghcr.io/<owner>/<repo>:latest and :<commit>. Azure Container Apps runs it
# (deploy/azure/deploy.sh). Needs one repository variable: VITE_NEON_AUTH_URL (Settings ->
# Secrets and variables -> Actions -> Variables); it is public, the browser uses it.
name: container image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "loadtest/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_NEON_AUTH_URL=${{ vars.VITE_NEON_AUTH_URL }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
